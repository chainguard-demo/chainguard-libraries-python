[project]
name = "poetry-example"
version = "0.1.0"
description = "Poetry example for Chainguard Libraries for Python"
authors = [{ name = "Manfred Moser", email = "manfred@simpligility.ca" }]
requires-python = ">=3.11"
dependencies = [
    "flask==2.0.0",
    "werkzeug==3.0.2",
]

[tool.poetry]
# Manage the environment only; this example is not a distributable package.
package-mode = false

[[tool.poetry.source]]
name = "chainguard-remediated"
url = "https://libraries.cgr.dev/python-remediated/simple"
priority = "primary"

[[tool.poetry.source]]
name = "chainguard"
url = "https://libraries.cgr.dev/python/simple"
priority = "primary"

# Poetry hangs on dependency resolution forever unless a PyPI source is
# declared. This is the one documented exception to direct-only access; it
# stays as a supplemental fallback behind the Chainguard sources.
[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
